name: Release

# Triggered by `bun run release <bump> --push`, which pushes a v* tag.
# This filename is registered as the npm Trusted Publisher workflow.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:check
      - name: tag matches package.json
        run: |
          TAG="${VERSION#v}"
          PKG="$(bun --print "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ]
      - name: changelog has a section for this version
        run: bun scripts/changelog.ts extract "${VERSION#v}"

  npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: npm 11.5.1 or newer for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: publish unless this version is already on npm
        run: |
          V="${VERSION#v}"
          if npm view "claudep@$V" version >/dev/null 2>&1; then
            echo "claudep@$V is already on npm; skipping"
          else
            npm publish --access public
          fi

  github-packages:
    name: mirror to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bordoni'
          package-manager-cache: false
      - name: scope the package name for GitHub Packages
        run: bun -e 'const p = await Bun.file("package.json").json(); p.name = "@bordoni/claudep"; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")'
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: release notes from the changelog
        run: bun scripts/changelog.ts extract "${VERSION#v}" > release-notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --verify-tag
